# Failure Forensics configuration. Secrets (the API key) live in .env, not here.

llm:
  base_url: https://api.deepseek.com
  pipeline_model: deepseek-flash      # the model under test (fast, cheap)
  judge_model: deepseek-v4-pro        # Phase 4 judge: stronger and different on purpose
  max_output_tokens: 4000             # hard cap per call; deepseek-flash's hidden reasoning counts against it
  temperature: 0.0
  concurrency: 4                      # max API requests in flight at once
  max_retries: 2                      # retries for rate limits / timeouts / 5xx
  backoff_base_seconds: 1.0           # waits 1s, 2s, 4s, ... between retries
  timeout_seconds: 180               # reasoning calls on long inputs can take over a minute

pipeline:
  max_document_chars: 20000           # intake rejects longer documents instead of silently truncating

# Phase 2: fact sheet -> document -> verification. Uses the stronger model, never the
# pipeline model, so test documents aren't written in the style of the model under test.
generation:
  max_attempts: 3                     # rewrites allowed when a document fails verification
  generator:                          # writes the document
    model: deepseek-v4-pro
    thinking: false                   # writing a letter doesn't need hidden reasoning; checks catch mistakes
    temperature: 0.9                  # variety across documents
    max_output_tokens: 4000
  verifier:                           # independent audit after the deterministic checks pass
    model: deepseek-v4-pro
    thinking: true                    # careful reading is the whole job here
    temperature: 0.0
    max_output_tokens: 8000

# Phase 4: root-cause analysis. The judge model is llm.judge_model.
analysis:
  judge_thinking: true                # careful reading is the whole job
  judge_max_output_tokens: 8000
  fail_at_or_below: 2                 # judge score (1-5) at which a step counts as failed
  suspect_at_or_below: 3              # ...and as a suspect, used only if no step clearly failed

# USD per 1M tokens. PLACEHOLDERS: check https://api-docs.deepseek.com/quick_start/pricing
# and update once the model IDs are confirmed. A model missing here gets cost = None, not 0.
prices:
  deepseek-flash:
    input_per_million: 0.28
    output_per_million: 0.42
  deepseek-v4-pro:
    input_per_million: 0.28
    output_per_million: 0.42

paths:
  fact_sheets: data/fact_sheets.yaml
  documents_dir: data/documents       # generated *.md plus manifest.json (generation + review state)
  ground_truth: data/ground_truth.json
  samples_dir: data/samples
  traces_dir: traces
  reports_dir: reports

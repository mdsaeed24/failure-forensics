# Fact sheets: the answer key. Write the facts first; the document is generated from them.
#
# Each sheet:
#   doc_id:    lowercase letters, digits, _ or - (e.g. inv_004). Unique. Becomes the file name.
#   doc_type:  invoice | receipt | purchase_order | quotation | contract | payment_reminder | other
#   style:     optional. A sentence steering the writing: sector, country, tone, layout.
#   parties:   at least one. name (exactly as it should appear) + role (free text).
#   dates:     optional. date (YYYY-MM-DD) + label (what the date is).
#   amounts:   optional. amount (number, max 2 decimals) + currency (ISO code) + label.
#
# The document will contain these facts and NO other names, dates or money amounts,
# so list every one you want in it. A total with no line-item prices is fine;
# if you want a subtotal and tax in the document, list them as amounts too.
#
# Supported currencies: AED AUD BRL CAD CHF CNY DKK EUR GBP HKD INR JPY KRW MXN NOK NZD
# PLN SAR SEK SGD USD ZAR. ("$" in a document always means USD.)
#
# Changing a sheet marks its document stale: regenerate it, then review it again.
#
# Ideas for a varied set of ~40-50: mix all seven types; several countries and
# currencies; 1-5 parties; 0-4 dates; 0-4 amounts; a few near-misses between types
# (quotation vs invoice, reminder vs invoice, receipt vs invoice, PO vs contract).

- doc_id: inv_001
  doc_type: invoice
  style: >-
    US web consultancy billing a retail client for a finished website project; formal,
    with a short description of the work delivered but no per-line prices.
  parties:

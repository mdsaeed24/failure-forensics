[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "failure-forensics"
version = "0.1.0"
description = "Tracing and root-cause analysis for a 4-step LLM document pipeline."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "openai>=1.40",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "pydantic>=2.12",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "streamlit>=1.40",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
